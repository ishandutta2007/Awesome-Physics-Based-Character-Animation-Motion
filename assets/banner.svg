<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Dynamic background grid and floating physics simulation particles */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseRing {
      0% { r: 12px; opacity: 0.9; }
      50% { r: 24px; opacity: 0.2; }
      100% { r: 12px; opacity: 0.9; }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes boneLink {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 40; }
    }
    .floating-node { animation: floatParticle 6s ease-in-out infinite; }
    .floating-node-2 { animation: floatParticle 8s ease-in-out infinite reverse; }
    .pulse-glow { animation: pulseGlow 7s ease-in-out infinite; }
    .bone-line { stroke-dasharray: 6 6; animation: boneLink 10s linear infinite; }
  </style>

  <!-- Deep ambient backgrounds -->
  <rect width="100%" height="100%" fill="#0b0f19"/>
  <rect width="100%" height="100%" fill="url(#bgGlow1)" class="pulse-glow"/>
  <rect width="100%" height="100%" fill="url(#bgGlow2)"/>
  <rect width="100%" height="100%" fill="url(#bgGlow3)"/>

  <!-- Subtle Perspective Physics Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.35">
    <!-- Horizontal depth planes -->
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="305" x2="1200" y2="305"/>
    <line x1="0" y1="325" x2="1200" y2="325"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="0" y1="352" x2="1200" y2="352"/>
    <!-- Vanishing rays towards center horizon -->
    <line x1="600" y1="260" x2="0" y2="360"/>
    <line x1="600" y1="260" x2="150" y2="360"/>
    <line x1="600" y1="260" x2="320" y2="360"/>
    <line x1="600" y1="260" x2="480" y2="360"/>
    <line x1="600" y1="260" x2="600" y2="360"/>
    <line x1="600" y1="260" x2="720" y2="360"/>
    <line x1="600" y1="260" x2="880" y2="360"/>
    <line x1="600" y1="260" x2="1050" y2="360"/>
    <line x1="600" y1="260" x2="1200" y2="360"/>
  </g>

  <!-- Dynamic Animated Skeletal IK Joint Nodes in Background (Left & Right) -->
  <g class="floating-node" opacity="0.55">
    <!-- Left Skeletal Cluster (IK Ragdoll) -->
    <line x1="120" y1="90" x2="190" y2="150" stroke="#818cf8" stroke-width="2.5" class="bone-line"/>
    <line x1="190" y1="150" x2="160" y2="230" stroke="#818cf8" stroke-width="2.5" class="bone-line"/>
    <line x1="190" y1="150" x2="250" y2="200" stroke="#06b6d4" stroke-width="2" class="bone-line"/>
    <circle cx="120" cy="90" r="7" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="190" cy="150" r="9" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="160" cy="230" r="6" fill="#a855f7"/>
    <circle cx="250" cy="200" r="5" fill="#38bdf8"/>
    <!-- Trajectory arc -->
    <path d="M 80 160 Q 150 70 230 110" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <g class="floating-node-2" opacity="0.55">
    <!-- Right Neural Dynamics Cluster (Physics-informed Controller) -->
    <line x1="1020" y1="80" x2="1080" y2="140" stroke="#ec4899" stroke-width="2.5" class="bone-line"/>
    <line x1="1080" y1="140" x2="1040" y2="220" stroke="#8b5cf6" stroke-width="2.5" class="bone-line"/>
    <line x1="1080" y1="140" x2="1140" y2="190" stroke="#06b6d4" stroke-width="2" class="bone-line"/>
    <circle cx="1020" cy="80" r="8" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="1080" cy="140" r="10" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="1040" cy="220" r="6" fill="#06b6d4"/>
    <circle cx="1140" cy="190" r="5" fill="#f43f5e"/>
    <!-- Ground vector indicator -->
    <line x1="1040" y1="220" x2="1040" y2="260" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 980 180 Q 1060 250 1150 160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- Ambient Physics Particles Floating -->
  <circle cx="280" cy="70" r="2.5" fill="#38bdf8" opacity="0.6" class="floating-node"/>
  <circle cx="920" cy="95" r="3" fill="#ec4899" opacity="0.5" class="floating-node-2"/>
  <circle cx="340" cy="240" r="2" fill="#a78bfa" opacity="0.4" class="floating-node"/>
  <circle cx="860" cy="220" r="2.5" fill="#06b6d4" opacity="0.5" class="floating-node-2"/>

  <!-- Center Foreground Content Container (Guaranteed Clear Legibility) -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <!-- Top Category Pill Tag -->
    <rect x="-185" y="0" width="370" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
    <text x="0" y="18" fill="#c7d2fe" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM &amp; BENCHMARKS</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#titleGrad)" font-size="36" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Physics-Based Character Animation &amp; Motion
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="112" fill="#cbd5e1" font-size="15" font-weight="500" letter-spacing="0.2">
      SaaS Platforms • Neural Motion Synthesis • Mocap Pipelines • DRL Locomotion Controllers
    </text>

    <!-- Feature Attribute Badges Bar in Foreground -->
    <g transform="translate(0, 138)">
      <!-- Badge 1: Neural Mocap -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
        <text x="82" y="21" fill="#93c5fd" font-size="12" font-weight="600">🎯 AI Video Mocap</text>
      </g>
      <!-- Badge 2: DRL Control -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6"/>
        <text x="82" y="21" fill="#c4b5fd" font-size="12" font-weight="600">🤖 DRL &amp; AMP Physics</text>
      </g>
      <!-- Badge 3: Diffusion & GPT -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="34" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6"/>
        <text x="87" y="21" fill="#fbcfe8" font-size="12" font-weight="600">✨ Text-to-Motion AI</text>
      </g>
      <!-- Badge 4: Rigging & Retargeting -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="85" y="21" fill="#6ee7b7" font-size="12" font-weight="600">🦴 Rigging &amp; Retarget</text>
      </g>
    </g>

    <!-- Bottom Metric / Tech Highlight Banner -->
    <g transform="translate(0, 195)">
      <line x1="-380" y1="0" x2="380" y2="0" stroke="url(#cyanLine)" stroke-width="1.5"/>
      <text x="0" y="20" fill="#94a3b8" font-size="12.5" font-weight="500">
        Blender • Unreal Engine • Isaac Lab • PyTorch • DeepMimic • Cascadeur • SMPL-X
      </text>
    </g>
  </g>
</svg>